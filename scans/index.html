<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<title>Scan history</title>

<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page-plane: #f9f9f7;
    --ink-primary: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --gridline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --track: #ece9e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page-plane: #0d0d0d;
      --ink-primary: #ffffff;
      --ink-secondary: #c3c2b7;
      --ink-muted: #898781;
      --gridline: #2c2c2a;
      --border: rgba(255,255,255,0.10);
      --track: #2c2c2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--ink-primary);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--ink-secondary); margin: 0 0 24px; font-size: 13px; }
  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--gridline); white-space: nowrap; }
  th { color: var(--ink-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; }
  .ticker { font-weight: 700; font-size: 15px; }
  .ticker-link { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--ink-muted); }
  .ticker-link:hover { border-bottom-style: solid; color: var(--delta-up); }
  .pattern-detail { color: var(--ink-muted); font-size: 11px; margin-top: 2px; white-space: normal; }
  .meter {
    width: 110px;
    height: 8px;
    border-radius: 4px;
    background: var(--track);
    overflow: hidden;
  }
  .meter-fill { height: 100%; border-radius: 4px; }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge-good { background: color-mix(in srgb, #0ca30c 16%, transparent); color: #0ca30c; }
  .badge-warning { background: color-mix(in srgb, #fab219 16%, transparent); color: #b8860b; }
  .badge-critical { background: color-mix(in srgb, #d03b3b 16%, transparent); color: #d03b3b; }
  .badge-muted { background: var(--track); color: var(--ink-secondary); font-weight: 600; }
  .earn-plain { color: var(--ink-muted); font-size: 12px; }
  .chip-row { display: flex; align-items: center; gap: 4px; }
  .chip-row + .chip-row { margin-top: 3px; }
  .chip-row-label { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--ink-muted); width: 24px; flex-shrink: 0; cursor: help; border-bottom: 1px dotted var(--ink-muted); }
  .chip { padding: 1px 6px; border-radius: 5px; font-size: 11px; background: var(--track); }
  .chip-pos { color: var(--delta-up); }
  .chip-neg { color: var(--ink-muted); }
  .chip-muted { color: var(--ink-muted); }
  .empty { padding: 40px; text-align: center; color: var(--ink-muted); }
  :root { --delta-up: #006300; }
  @media (prefers-color-scheme: dark) { :root { --delta-up: #0ca30c; } }
  .chart-card-caption { color: var(--ink-muted); font-size: 11px; margin-top: 6px; }
  .chart-unavailable { color: var(--ink-muted); font-size: 12px; padding: 24px 0; text-align: center; }
  [hidden] { display: none !important; }
  .chart-trigger { cursor: default; }
  .th-tip { cursor: help; border-bottom: 1px dotted var(--ink-muted); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink-primary); }
  th.sortable::after { content: ""; margin-left: 4px; opacity: 0.35; }
  th.sortable.sort-asc::after { content: "\2191"; opacity: 1; }
  th.sortable.sort-desc::after { content: "\2193"; opacity: 1; }
  .chart-popover {
    position: fixed;
    display: none;
    z-index: 50;
    width: 640px;
    max-width: calc(100vw - 32px);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    pointer-events: none;
  }

</style>


<style>
  .nav-pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 28px; padding: 0; list-style: none; }
  .nav-pill {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    color: var(--ink-primary);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
  }
  .nav-pill:hover { border-color: var(--ink-muted); }
  .month-group + .month-group { margin-top: 22px; }
  .month-heading {
    color: var(--ink-muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 8px;
    padding: 0 14px;
  }
  .scan-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--gridline);
  }
  .month-group .panel tr:last-child, .scan-row:last-child { border-bottom: none; }
  .scan-row:hover { background: var(--track); }
  .scan-date { color: inherit; text-decoration: none; font-weight: 600; font-variant-numeric: tabular-nums; }
  .scan-date:hover { color: var(--delta-up); }
  .scan-row-extra a {
    color: var(--ink-secondary);
    text-decoration: none;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--track);
  }
  .scan-row-extra a:hover { color: var(--ink-primary); }
</style>

</head>

</body>
</html>
